  <style>
    :root {

    * { box-sizing: border-box; }

    body {

        radial-gradient(1000px 480px at 0% 0%, rgba(37, 116, 235, 0.07), transparent 60%),

      line-height: 1.5;

    /* Unified Page Shell */

    /* Page Title Hero */

    /* Surface & Panel System */

      border: 1px solid rgba(34, 30, 24, 0.09);

    /* Standardized 40px Form Control System */

    .form-field input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
    .form-field select {

      height: 2.5rem; /* 40px strict height */

    .badge.ok {

    /* Tables */
    .table-wrap, .domain-table-wrap {
      overflow-x: auto;

    table {

    th, td {

    .toast-item {

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const host = document.createElement('div');
      host.id = 'globalToastHost';
      host.style.cssText = 'position:fixed;bottom:1.25rem;right:1.25rem;z-index:9999;display:flex;flex-direction:column;gap:0.5rem;pointer-events:none;max-width:24rem;';
      document.body.appendChild(host);

      function showToast(text, cls) {
        if (!text || text.length < 2) return;
        if (/正在|加载当前配置|连接中/.test(text)) return;
        const item = document.createElement('div');
        const isOk = cls.includes('ok') || cls.includes('leaf');
        const isBad = cls.includes('bad') || cls.includes('rose');
        item.className = 'toast-item ' + (isOk ? 'ok' : isBad ? 'bad' : '');
        const dotColor = isOk ? '#34d399' : isBad ? '#fb7185' : '#60a5fa';
        item.innerHTML = `<span style="width:7px;height:7px;border-radius:99px;background:${dotColor};flex-shrink:0"></span><span style="line-height:1.35">${text.replace(/</g, '&lt;')}</span>`;
        host.appendChild(item);
        while (host.children.length > 3) host.removeChild(host.firstChild);
        setTimeout(() => {
          item.style.opacity = '0';
          item.style.transform = 'translateY(4px)';
          item.style.transition = 'all 0.18s ease';
          setTimeout(() => item.remove(), 200);
        }, 2600);
      }

      const targets = document.querySelectorAll('.message, #formMessage, #configMessage, #storageMessage');
      targets.forEach((el) => {
        let lastText = el.textContent.trim();
        const obs = new MutationObserver(() => {
          const cur = el.textContent.trim();
          if (cur && cur !== lastText) {
            lastText = cur;
            showToast(cur, el.className || '');
          }
        });
        obs.observe(el, { childList: true, characterData: true, subtree: true });
      });
    });
  </script>
